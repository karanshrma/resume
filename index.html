<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karan Sharma — Developer Portfolio</title>
    <meta name="description" content="Portfolio of Karan Sharma — Flutter Developer building cross-platform mobile apps with Flutter, Dart, and modern backends." />
    <meta name="author" content="Karan Sharma" />
    <link rel="canonical" href="https://portfolio-eta-inky-11.vercel.app/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Apply the saved theme (or the browser's preference) before first paint
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.add(theme);
          root.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0A0A0A' : '#FBFAF7');
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
